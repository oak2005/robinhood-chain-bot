name: trade
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: robinhood-trade
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    environment: next-cycle
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Write secrets outside git
        env:
          ROBINHOOD_CREDS: ${{ secrets.ROBINHOOD_CREDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          set -eu
          mkdir -p .secrets data
          printf '%s\n' "$ROBINHOOD_CREDS" > .secrets/robinhood_creds.json
          printf '%s\n' "$TELEGRAM_BOT_TOKEN" > .secrets/telegram_bot_token
          printf '%s\n' "$TELEGRAM_ADMIN_ID" > .secrets/telegram_admin_id
          chmod 600 .secrets/*
          test -s .secrets/robinhood_creds.json
          test -s .secrets/telegram_bot_token
          test -s .secrets/telegram_admin_id
      - name: Check secret shape
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const raw = JSON.parse(fs.readFileSync(".secrets/robinhood_creds.json","utf8"));
          const key = String(raw.privateKeyHex || "").replace(/^0x/, "");
          const addr = String(raw.address || "");
          const token = fs.readFileSync(".secrets/telegram_bot_token","utf8").trim();
          const admin = fs.readFileSync(".secrets/telegram_admin_id","utf8").trim();
          if (raw.type !== "wallet" || !/^[0-9a-fA-F]{64}$/.test(key) || !/^0x[0-9a-fA-F]{40}$/.test(addr)) {
            console.log("creds bad");
            process.exit(1);
          }
          if (!token.includes(":") || !/^\d{6,}$/.test(admin)) {
            console.log("telegram bad");
            process.exit(1);
          }
          console.log("secrets ok");
          '
      - name: Use the latest saved clock
        run: |
          set -eu
          git fetch origin main
          git checkout origin/main -- data/stillmark-bot.json data/clip-cycle.json data/telegram_offset
      - name: One due round trip
        env:
          STILLMARK_ROOT: ${{ github.workspace }}
        run: |
          set -eu
          gate=$(curl -fsS --max-time 8 https://robinhood-chain-bot-production.up.railway.app/api/trade-gate || echo '{}')
          printf '%s' "$gate" > /tmp/gate.json
          if printf '%s' "$gate" | grep -q '"telegram":true'; then
            export STILLMARK_SKIP_DRAIN=1
          fi
          if printf '%s' "$gate" | grep -q '"paused":true'; then
            echo "paused from telegram"
            exit 0
          fi
          node --experimental-strip-types -e '
            import fs from "node:fs";
            let gate = {};
            try { gate = JSON.parse(fs.readFileSync("/tmp/gate.json","utf8")); } catch { process.exit(0); }
            const allowed = ["10m","20m","30m","1h"];
            if (!allowed.includes(gate.interval)) process.exit(0);
            const path = "data/stillmark-bot.json";
            const state = JSON.parse(fs.readFileSync(path,"utf8"));
            state.config = { ...(state.config ?? {}), interval: gate.interval };
            fs.writeFileSync(path, JSON.stringify(state));
          '
          node --experimental-strip-types src/lib/telegram/wake-once.ts
      - name: Save state
        run: |
          set -eu
          rm -rf .secrets
          cp data/stillmark-bot.json /tmp/stillmark-bot.json
          cp data/clip-cycle.json /tmp/clip-cycle.json
          cp data/telegram_offset /tmp/telegram_offset
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/stillmark-bot.json data/stillmark-bot.json
          cp /tmp/clip-cycle.json data/clip-cycle.json
          cp /tmp/telegram_offset data/telegram_offset
          git config user.email "bot@users.noreply.github.com"
          git config user.name "robinhood-bot"
          git add data/*.json data/telegram_offset
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "state [skip ci]"
          git push origin HEAD:main

